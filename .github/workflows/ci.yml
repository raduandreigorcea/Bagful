name: CI

# Triggers on push again, plainly, because there is no longer a second commit to
# chase. The version bump happens in .githooks/pre-commit, inside the commit you
# make, so the commit you push is the only one there is — and a push-triggered run
# attaches its result to exactly that commit.
#
# This briefly worked the other way round: version-bump.yml pushed a follow-up
# commit, which GitHub's loop protection meant could start nothing, so CI had to
# be dispatched back at it. Deleting that workflow deleted the problem.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo; without this the token gets the repo default.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      # The catalog is needed here as well: test/catalog/markets.test.js is a
      # cross-repo drift guard and reads the catalog's own market list and
      # migration, which is the whole reason it can catch a drift at all.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bagful-catalog is private, which the workflow token cannot read, so it is
      # fetched on its own with a read-only deploy key on that repo (its private
      # half is the secret CATALOG_DEPLOY_KEY), at the tip of its master
      # (catalog/ is not tracked here; .gitignore says why). admin/ is private
      # too and nothing here needs it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raduandreigorcea/Bagful-catalog
          ref: master
          path: catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency advisories, which nothing else here would notice. Scoped to
      # production dependencies on purpose: a dev-only advisory is real but
      # cannot reach a user, and failing the build over one means the next
      # genuine finding arrives in a step that is already red and being ignored.
      # --audit-level=high for the same reason — moderate advisories on a
      # transitive build tool are noise at this project's size.
      - run: npm audit --omit=dev --audit-level=high
      # Before typecheck: lint failures are usually the cheaper thing to read,
      # and this is the step most likely to catch a template mistake vue-tsc
      # cannot see.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rls-tests:
    name: Database RLS tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      - run: supabase db start
      # `db start` does NOT reliably apply supabase/migrations: where a local
      # backup exists it restores that and skips them. A cold runner has no
      # backup, so this job happened to be testing the real schema — but the same
      # two commands are what gets run on a developer's machine, where the backup
      # does exist and the suite then passes against a schema the migrations were
      # never applied to. `db reset` rebuilds from supabase/migrations every time,
      # so CI and local runs are testing the same thing.
      - run: supabase db reset
      # The pgTAP suites in supabase/tests, against that schema.
      - run: supabase test db
      # src/types/database.ts is generated from this same schema. A migration
      # committed without `npm run types` would leave the app typechecking
      # against columns and RPC arguments that no longer exist.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts || { echo "::error::src/types/database.ts is stale: run npm run types"; exit 1; }

  catalog-tests:
    name: Catalog schema tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      # The catalog checkout is REQUIRED, not a convenience. The catalog's schema
      # lives in raduandreigorcea/Bagful-catalog, checked out at catalog/, and
      # without it there is no config.toml for --workdir to point at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bagful-catalog is private, which the workflow token cannot read, so it is
      # fetched on its own with a read-only deploy key on that repo (its private
      # half is the secret CATALOG_DEPLOY_KEY), at the tip of its master
      # (catalog/ is not tracked here; .gitignore says why). admin/ is private
      # too and nothing here needs it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raduandreigorcea/Bagful-catalog
          ref: master
          path: catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      # WHY THIS JOB IS IN THE APP'S CI EVEN THOUGH THE SCHEMA IS NOT
      #
      # The dependency runs the other way from the ownership. src/lib/
      # productSuggestions.ts calls search_catalog(p_query, p_limit, p_markets,
      # p_langs) and reads (name, maker, popularity) back, so a change to that
      # RPC in the other repo breaks this app with nothing here to warn anyone.
      # Running the catalog's own pgTAP suite here turns that into a red build
      # instead of an empty suggestions dropdown in production.
      #
      # --workdir names a project ROOT: the CLI looks for
      # `<workdir>/supabase/config.toml` beneath it.
      - run: supabase --workdir catalog db start
      # Same reason as rls-tests: `db start` restores a backup where one exists
      # and skips the migrations, so the suite would test a stale schema on any
      # machine that has run it before. `db reset` rebuilds unconditionally.
      - run: supabase --workdir catalog db reset
      - run: supabase --workdir catalog test db
      # Same check for src/types/catalog.ts. This is what catches a catalog
      # RPC change landing on the catalog's master with stale app types.
      - name: Generated types match the catalog migrations
        run: |
          supabase --workdir catalog gen types typescript --local --schema public > /tmp/catalog.ts
          diff -u src/types/catalog.ts /tmp/catalog.ts || { echo "::error::src/types/catalog.ts is stale: run npm run types"; exit 1; }

  # ─── Deploy, on master only, once everything above is green ──────────────────
  # Database first, then edge functions, then the web app, so new code never
  # goes live against a schema that lacks what it calls.
  #
  # Vercel used to deploy on its own the moment master moved, racing this: the
  # app could be live before its migration was. vercel.json now turns that off
  # for master ("git.deploymentEnabled") and the last step below asks Vercel for
  # the deploy through a deploy hook. Previews still deploy on their own.
  #
  # The APK (release-apk.yml) is not chained to this. It builds for several
  # minutes and a migration takes about one, and nobody runs a release until
  # they install it, so in practice it always lands after.
  #
  # Only Bagful-prod. Bagful-dev gets a migration by hand while it is written.
  deploy:
    name: Deploy to production
    needs: [test, rls-tests, catalog-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Queued, never cancelled: a push cancelled between repair and push would
    # leave a migration marked reverted in production's history.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PROJECT_REF: qwpyiperbjaeykrvilhf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history, to diff against whatever master was before this push.
          fetch-depth: 0
      - name: Check the deploy secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN VERCEL_DEPLOY_HOOK; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing"
            exit 1
          fi
          git cat-file -e "$BEFORE^{commit}" || { echo "::error::Cannot see the previous master ($BEFORE), so cannot tell what changed"; exit 1; }
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      # 001-009 are restatements production already records as applied, so an
      # EDITED one is skipped by a plain push. Each edited file is marked reverted
      # first, then pushed with --include-all (see /shipping-a-migration). A new
      # file needs neither. If the push fails, the history is put back.
      - name: Apply changed migrations
        run: |
          edited=$(git diff --name-only --diff-filter=M "$BEFORE" "$GITHUB_SHA" -- 'supabase/migrations/*.sql')
          added=$(git diff --name-only --diff-filter=AR "$BEFORE" "$GITHUB_SHA" -- 'supabase/migrations/*.sql')
          if [ -z "$edited$added" ]; then echo "No migration changed."; exit 0; fi
          # No database password: with only the access token, the CLI signs in
          # through a temporary login role it creates for the session.
          supabase link --project-ref "$PROJECT_REF"
          versions=""
          for file in $edited; do
            version=$(basename "$file"); version=${version%%_*}
            supabase migration repair --status reverted "$version" --linked --yes
            versions="$versions $version"
          done
          if ! supabase db push --include-all --linked --yes; then
            for version in $versions; do
              supabase migration repair --status applied "$version" --linked --yes
            done
            exit 1
          fi
      # A change under _shared reaches every function, so it deploys them all.
      # Each one's verify_jwt comes from supabase/config.toml.
      - name: Deploy changed edge functions
        run: |
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- supabase/functions)
          if [ -z "$changed" ]; then echo "No edge function changed."; exit 0; fi
          if grep -q '^supabase/functions/_shared/' <<<"$changed"; then
            names=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -printf '%f\n')
          else
            names=$(sed -n 's#^supabase/functions/\([^/]*\)/.*#\1#p' <<<"$changed" | sort -u)
          fi
          for name in $names; do
            [ -d "supabase/functions/$name" ] || continue # deleted in this push
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api
          done
      - name: Deploy the web app
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
