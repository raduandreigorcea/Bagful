name: CI

# Triggers on push again, plainly, because there is no longer a second commit to
# chase. The version bump happens in .githooks/pre-commit, inside the commit you
# make, so the commit you push is the only one there is — and a push-triggered run
# attaches its result to exactly that commit.
#
# This briefly worked the other way round: version-bump.yml pushed a follow-up
# commit, which GitHub's loop protection meant could start nothing, so CI had to
# be dispatched back at it. Deleting that workflow deleted the problem.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo; without this the token gets the repo default.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      # The catalog is needed here as well: test/catalog/markets.test.js is a
      # cross-repo drift guard and reads the catalog's own market list and
      # migration, which is the whole reason it can catch a drift at all.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bagful-catalog is private, which the workflow token cannot read, so it is
      # fetched on its own with a read-only deploy key (secret CATALOG_DEPLOY_KEY,
      # deploy key "FamCart CI (read-only)" on that repo), at the exact commit this
      # repo pins for it. admin/ is private too and nothing here needs it.
      - name: Find the pinned catalog commit
        id: catalog
        run: echo "sha=$(git rev-parse HEAD:catalog)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raduandreigorcea/Bagful-catalog
          ref: ${{ steps.catalog.outputs.sha }}
          path: catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency advisories, which nothing else here would notice. Scoped to
      # production dependencies on purpose: a dev-only advisory is real but
      # cannot reach a user, and failing the build over one means the next
      # genuine finding arrives in a step that is already red and being ignored.
      # --audit-level=high for the same reason — moderate advisories on a
      # transitive build tool are noise at this project's size.
      - run: npm audit --omit=dev --audit-level=high
      # Before typecheck: lint failures are usually the cheaper thing to read,
      # and this is the step most likely to catch a template mistake vue-tsc
      # cannot see.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rls-tests:
    name: Database RLS tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      - run: supabase db start
      # `db start` does NOT reliably apply supabase/migrations: where a local
      # backup exists it restores that and skips them. A cold runner has no
      # backup, so this job happened to be testing the real schema — but the same
      # two commands are what gets run on a developer's machine, where the backup
      # does exist and the suite then passes against a schema the migrations were
      # never applied to. `db reset` rebuilds from supabase/migrations every time,
      # so CI and local runs are testing the same thing.
      - run: supabase db reset
      # The pgTAP suites in supabase/tests, against that schema.
      - run: supabase test db
      # src/types/database.ts is generated from this same schema. A migration
      # committed without `npm run types` would leave the app typechecking
      # against columns and RPC arguments that no longer exist.
      - name: Generated types match the migrations
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts || { echo "::error::src/types/database.ts is stale: run npm run types"; exit 1; }

  catalog-tests:
    name: Catalog schema tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      # The catalog checkout is REQUIRED, not a convenience. The catalog's schema
      # lives in raduandreigorcea/Bagful-catalog, checked out at catalog/, and
      # without it there is no config.toml for --workdir to point at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Bagful-catalog is private, which the workflow token cannot read, so it is
      # fetched on its own with a read-only deploy key (secret CATALOG_DEPLOY_KEY,
      # deploy key "FamCart CI (read-only)" on that repo), at the exact commit this
      # repo pins for it. admin/ is private too and nothing here needs it.
      - name: Find the pinned catalog commit
        id: catalog
        run: echo "sha=$(git rev-parse HEAD:catalog)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raduandreigorcea/Bagful-catalog
          ref: ${{ steps.catalog.outputs.sha }}
          path: catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          persist-credentials: false
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      # WHY THIS JOB IS IN THE APP'S CI EVEN THOUGH THE SCHEMA IS NOT
      #
      # The dependency runs the other way from the ownership. src/lib/
      # productSuggestions.ts calls search_catalog(p_query, p_limit, p_markets,
      # p_langs) and reads (name, maker, popularity) back, so a change to that
      # RPC in the other repo breaks this app with nothing here to warn anyone.
      # Running the catalog's own pgTAP suite here turns that into a red build
      # instead of an empty suggestions dropdown in production.
      #
      # --workdir names a project ROOT: the CLI looks for
      # `<workdir>/supabase/config.toml` beneath it.
      - run: supabase --workdir catalog db start
      # Same reason as rls-tests: `db start` restores a backup where one exists
      # and skips the migrations, so the suite would test a stale schema on any
      # machine that has run it before. `db reset` rebuilds unconditionally.
      - run: supabase --workdir catalog db reset
      - run: supabase --workdir catalog test db
      # Same check for src/types/catalog.ts. This is what catches a catalog
      # RPC change landing through a submodule bump with stale app types.
      - name: Generated types match the catalog migrations
        run: |
          supabase --workdir catalog gen types typescript --local --schema public > /tmp/catalog.ts
          diff -u src/types/catalog.ts /tmp/catalog.ts || { echo "::error::src/types/catalog.ts is stale: run npm run types"; exit 1; }
