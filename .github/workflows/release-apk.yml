name: Android APK

# Builds the debug APK and pins it to the rolling "latest" release, so the newest
# build is always at the same download URL:
# https://github.com/raduandreigorcea/Bagful/releases/latest
#
# Runs on push to master, and the APK carries the same version as the web app
# because the bump is already in the commit being pushed (.githooks/pre-commit).
#
# It has been both ways round. While version-bump.yml pushed the new version as a
# separate commit *after* the push, a push-triggered build here read the old
# number and the published APK trailed the web app by one patch forever. Moving
# the bump into the commit itself is what makes the plain trigger correct again.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # create/update the release and its APK asset

# Two merges landing close together dispatch two builds that both publish to the
# same rolling release. Serialise them so they cannot interleave.
#
# Deliberately NOT cancel-in-progress: publishing is a delete followed by a
# re-create (see below), so cancelling a run mid-way can leave the release
# deleted and nothing put back — no download URL at all until the next merge.
# Queueing instead costs one redundant build and is never destructive. Ordering
# still comes out right: GitHub keeps only the newest pending run, so the last
# build to publish is the newest version.
concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build and release APK
    runs-on: ubuntu-latest
    steps:
      # Named explicitly rather than relying on the dispatch ref, so this always
      # builds the tip of master — which by the time we are dispatched includes
      # the version bump.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      # The test step reads the catalog's market list (test/catalog/).
      # Bagful-catalog is private, which the workflow token cannot read, so it is
      # fetched on its own with a read-only deploy key on that repo (its private
      # half is the secret CATALOG_DEPLOY_KEY), at the exact commit this
      # repo pins for it. admin/ is private too and nothing here needs it.
      - name: Find the pinned catalog commit
        id: catalog
        run: echo "sha=$(git rev-parse HEAD:catalog)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: raduandreigorcea/Bagful-catalog
          ref: ${{ steps.catalog.outputs.sha }}
          path: catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Vite quietly bakes `undefined` into the bundle when an env var is
      # missing, which would ship a broken app — fail loudly instead.
      #
      # Every secret the build step below consumes is checked here, and the two
      # lists must stay in step. They drifted once already: the check tested two
      # of the five and the message named all five, so a blank ANON_KEY or
      # ONESIGNAL_APP_ID passed the guard, built green, and published.
      #
      # The split between fatal and warning is what the app itself does with a
      # missing value, not how important the service feels:
      #
      #   REQUIRED  nothing works without it. No Supabase URL or anon key and
      #             every query fails; no Clerk key and there is no sign-in.
      #   OPTIONAL  src/lib/pushNotifications.ts and src/lib/errorReporting.ts
      #             both check for their value and no-op when it is absent, by
      #             design, so a build without them is degraded but functional.
      #             Failing here would block a release over a working app —
      #             but losing one silently is how Android ran with no error
      #             reporting at all, so it is loud in the log instead.
      - name: Check build secrets
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CLERK_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          CATALOG_URL: ${{ secrets.VITE_CATALOG_SUPABASE_URL }}
          CATALOG_ANON_KEY: ${{ secrets.VITE_CATALOG_SUPABASE_ANON_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          missing=
          # The catalog pair is required, not a warning. Without it the app
          # falls back to list-contributed products only -- an add-item box
          # that finds almost nothing, on a build that looks entirely healthy.
          # That is a worse failure than not shipping.
          for name in SUPABASE_URL SUPABASE_ANON_KEY CLERK_KEY CATALOG_URL CATALOG_ANON_KEY; do
            # Indirect expansion: ${!name} is the value of the variable *named*
            # by $name, so one loop covers every required secret.
            [ -n "${!name}" ] || missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secrets:$missing"
            echo "Set VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_CLERK_PUBLISHABLE_KEY, VITE_CATALOG_SUPABASE_URL and VITE_CATALOG_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Warnings, not failures — see the note above. ::warning:: surfaces
          # these in the run summary, so a release that quietly lost push or
          # error reporting is visible without digging through the log.
          [ -n "$ONESIGNAL_APP_ID" ] || echo "::warning::VITE_ONESIGNAL_APP_ID is empty — this build ships with push notifications disabled."
          [ -n "$SENTRY_DSN" ] || echo "::warning::VITE_SENTRY_DSN is empty — this build ships with no error reporting."
          [ -n "$POSTHOG_KEY" ] || echo "::warning::VITE_POSTHOG_KEY is empty — this build ships with no analytics."

      # The signing key is not optional here, and failing without it has to be
      # loud. android/app/build.gradle falls back to the debug key when no
      # keystore is passed — right for a local build, silently poisonous for this
      # one, because the debug key is generated fresh on every runner. A build
      # published under a one-off identity installs for nobody who already has
      # the app: Android rejects an APK signed by a different key than the
      # installed one, and the in-app updater would fail for every user until the
      # next correctly-signed release.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets: set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD under Settings → Secrets and variables → Actions."
            echo "ANDROID_KEYSTORE_BASE64 is 'base64 -w0 bagful-release.keystore' from the existing keystore -- NOT a new one."
            echo "Generating a fresh key here would publish an APK that installs for nobody who already has Bagful."
            exit 1
          fi

      # A version that has not moved publishes nothing anyone can install. The
      # release is replaced with the same number, every phone compares it against
      # its own, finds nothing newer, and stays where it is -- and not one thing
      # goes red. That is exactly what happens when .githooks/pre-commit did not
      # run, which is easier than it sounds: the hook is opt-in per clone
      # (`git config core.hooksPath .githooks`) and it deliberately exits quietly
      # when npm is not on PATH, because refusing someone's commit is worse than
      # losing a bump.
      #
      # So the bump is checked here, in the one place nobody can skip. It fails
      # safe: a wrong answer stops a release being published, never publishes a
      # bad one. Ordered before `npm ci` so it costs seconds rather than a build.
      - name: Check the version moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          # Read back what is actually published rather than trusting a tag: the
          # release name is what the app parses, so it is what has to differ.
          PUBLISHED=$(gh release view latest --json name --jq .name 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)

          if [ -z "$PUBLISHED" ]; then
            echo "No published release yet. Publishing $NEW."
            exit 0
          fi

          if [ "$NEW" = "$PUBLISHED" ]; then
            echo "::error::package.json is still $NEW, the same version already published."
            echo "The version bump did not happen, so this build would reach nobody."
            echo "In the clone that made this commit, run:  git config core.hooksPath .githooks"
            exit 1
          fi

          # sort -V compares each field as a number, so 0.1.9 sorts below 0.1.10.
          # Plain sort puts them the other way round and would wave a downgrade
          # through -- the same trap compareVersions avoids in src/lib/nativeUpdate.ts.
          OLDEST=$(printf '%s\n%s\n' "$NEW" "$PUBLISHED" | sort -V | head -1)
          if [ "$OLDEST" != "$PUBLISHED" ]; then
            echo "::error::package.json is $NEW, older than the published $PUBLISHED."
            echo "Android refuses a lower versionCode, so this APK could not install as an update."
            exit 1
          fi

          echo "$PUBLISHED -> $NEW"

      - run: npm ci

      # The same gate CI runs, here because nothing makes this workflow wait for
      # CI: both start on the same push, and master is not protected. Without it
      # a commit that fails its tests still reaches every phone.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Keep this list and the "Check build secrets" step above in step.
      #
      # VITE_SENTRY_DSN was absent here for the life of the workflow, and
      # nothing caught it: startErrorReporting() in src/lib/errorReporting.ts
      # treats an empty DSN as "reporting is off" and returns before importing
      # the SDK — the same path dev, CI and tests take — so every published APK
      # built green, ran fine, and reported no crash it ever hit. The web app
      # was unaffected because Vercel supplies the value from its own project
      # environment, which is why Sentry looked healthy.
      #
      # VITE_SUPABASE_PUBLISHABLE_KEY used to be passed here too. Nothing in
      # src/ reads it; the client is built from VITE_SUPABASE_ANON_KEY.
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CATALOG_SUPABASE_URL: ${{ secrets.VITE_CATALOG_SUPABASE_URL }}
          VITE_CATALOG_SUPABASE_ANON_KEY: ${{ secrets.VITE_CATALOG_SUPABASE_ANON_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Uploads source maps and stamps the release (vite.config.js). Without
          # it production APK errors reach Sentry with no release and minified
          # frames only; empty is allowed and just skips the upload.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Declared rather than inferred. lib/appChannel would work this out
          # from the Supabase URL anyway, but this is the file that defines what
          # a production build IS, so it says so: anything that reaches a phone
          # from here is production, and a wrong secret becomes a mismatch to
          # notice rather than a badge that quietly fails to appear.
          VITE_APP_CHANNEL: production
        run: npm run build

      - run: npx cap sync android

      # Written outside the workspace so it cannot be picked up by anything that
      # walks the repo, and removed by the runner along with the whole VM.
      - name: Restore signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/bagful-release.keystore"

      # assembleProductionRelease, not assembleDebug: a debug build is marked
      # debuggable and signed with a throwaway key. The signing config it uses is
      # chosen in android/app/build.gradle from these four variables.
      #
      # The flavour is named explicitly because there are two. A plain
      # assembleRelease would also build the nightly APK, which has no business
      # being produced by the job that publishes what people install.
      - name: Build APK
        env:
          BAGFUL_KEYSTORE_FILE: ${{ runner.temp }}/bagful-release.keystore
          BAGFUL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BAGFUL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BAGFUL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleProductionRelease

      # Gone the moment the APK is signed, so no later step ever has the key on
      # disk to read. always(): a failed build must not leave it lying there
      # for whatever runs next in this job.
      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bagful-release.keystore"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/production/release/app-production-release.apk Bagful.apk

      # Read back what was actually built rather than reporting github.sha. On a
      # workflow_dispatch that variable is the tip at dispatch time, which is not
      # necessarily what the checkout above landed on, and the whole point of this
      # change is that the version in the release notes matches the version in the
      # app. Taken from the checked-out tree, so it cannot disagree.
      - name: Identify the build
        id: built
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Editing a release in place keeps its original publish date, so the
      # releases page would claim the build is old forever. Delete and
      # re-publish: the shown date becomes the build time, and the "latest"
      # tag moves to the commit that was actually built. The || true covers
      # the first run, when there is nothing to delete yet.
      - name: Delete previous "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      # With the gh CLI the step above already uses, not a third-party action:
      # this job held the signing key, and an action pinned by a tag runs
      # whatever its maintainer points that tag at next.
      #
      # The version goes in the NAME (--title), not just the body, because the
      # name is all the releases list shows, and "latest build" alone says a
      # build exists but never which one. The tag stays `latest` regardless:
      # it is the rolling download URL and must not move with the version.
      #
      # The name is also read by the app itself: src/lib/nativeUpdate.ts pulls
      # this release from the GitHub API and takes the version out of this
      # string to decide whether to offer an update. Changing the format so a
      # `major.minor.patch` can no longer be found in it turns the in-app
      # updater off silently, for everyone.
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.built.outputs.version }}
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          cat > notes.md <<EOF
          Newest Bagful Android app, built automatically from \`master\`.

          **Already have Bagful?** You don't need this page. The app offers
          the update itself the next time you open it.

          **First install:** download \`Bagful.apk\` on your phone and open it.
          Updating over an existing install keeps your data.

          Version: $VERSION
          Commit: $SHA
          EOF
          gh release create latest Bagful.apk \
            --title "Bagful v$VERSION" \
            --notes-file notes.md \
            --target "$SHA" \
            --latest
