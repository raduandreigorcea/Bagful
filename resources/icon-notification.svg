  <!-- The logo as one shape, for places that draw only an outline: Android's
       notification icon and the badge web push shows on Android Chrome. The
       groceries are merged into one silhouette (drawn apart they read as a
       little figure) and stop at y=232, a gap above the bag. Plain paths and
       fill-rule only, because scripts/build-icons.mjs turns this file into an
       Android vector drawable, which has no transforms or masks to lean on. -->
