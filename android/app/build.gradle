import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// THE VERSION COMES FROM package.json
//
// It used to be `versionCode 1 / versionName "1.0"` here, frozen at whatever
// Capacitor generated, while the real version moved with every commit (see
// .githooks/pre-commit) and reached the web bundle through vite's define. So the
// APK's own version — the one Android shows in App info, and the one an update
// is judged against — said 1.0 forever. Now there is one number in one file and
// everything else reads it.
def appVersionName = new JsonSlurper().parseText(rootProject.file('../package.json').text).version
def versionParts = (appVersionName =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!versionParts.find()) {
    throw new GradleException("package.json version '${appVersionName}' is not major.minor.patch")
}

// Android's own ordering, which has to be an integer and has to only ever go up.
// The patch field gets four digits because it is the one that moves on every
// single commit; the day a version needs a 10000th patch, widen this and every
// installed copy still updates, because the number only grows.
def appVersionCode = versionParts.group(1).toInteger() * 1000000 +
    versionParts.group(2).toInteger() * 10000 +
    versionParts.group(3).toInteger()

// SIGNING
//
// Android refuses to install an APK over an app signed with a different key, so
// the in-app updater (AppInstallerPlugin) only works if every build is signed
// with the same one. `assembleDebug` is not that: the debug key is generated on
// first use per machine, so CI — a fresh VM each run — invented a new identity
// for every build and no release could ever update the one before it.
//
// The real key is passed in by environment, never committed. Missing, this falls
// back to the debug key so a plain local `assembleRelease` still produces
// something installable on the phone in front of you — a build that cannot
// update anyone else's install, which is exactly what a local build is.
def keystorePath = System.getenv('BAGFUL_KEYSTORE_FILE')
def hasKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace = "com.bagful.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bagful.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // TWO CHANNELS, TWO APPS
    //
    // The nightly build is not a variant of the installed app, it is a second
    // app: its own application id, its own icon on the launcher, its own data.
    // That is the whole point. A nightly APK that replaced production would
    // mean choosing, every time, between testing and having a working shopping
    // list on the phone you actually shop with.
    //
    // The suffix is what buys that. Everything else here follows from it:
    //
    //   ssoScheme      a URL scheme is claimed per app, so if both declared
    //                  bagful:// Android would interrupt every OAuth sign-in
    //                  to ask which Bagful should receive it. The matching
    //                  half lives in src/lib/ssoScheme.ts.
    //   app_name       src/nightly/res/values/strings.xml, because a resource
    //                  in a flavour source set overrides main. resValue would
    //                  collide with the string already declared there.
    //
    // The version is shared: separate application ids mean neither build ever
    // judges an update against the other.
    flavorDimensions = ["channel"]
    productFlavors {
        production {
            dimension "channel"
            manifestPlaceholders = [ssoScheme: "bagful"]
        }
        nightly {
            dimension "channel"
            applicationIdSuffix ".nightly"
            manifestPlaceholders = [ssoScheme: "bagfulnightly"]
        }
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv('BAGFUL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BAGFUL_KEY_ALIAS')
                keyPassword System.getenv('BAGFUL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
